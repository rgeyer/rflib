name: Radio model submission
description: Offer a radio model you've made, so it ships with rflib.
title: "Radio model: "
labels: ["radio-model"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing a model. A maintainer checks it against your sample and adds it as a built-in, citing your sample as its source.
        See "Radios CHIRP supports but rflib doesn't" in the README for making one. Check it with `rflib model validate`, and use it on your radio (`rflib model install FILE`) before submitting.
  - type: input
    id: radio
    attributes:
      label: Radio
      description: Make and model as printed on the radio, plus region or firmware if it matters.
      placeholder: Baofeng UV-5R (US)
    validations:
      required: true
  - type: input
    id: chirp-model
    attributes:
      label: CHIRP radio
      description: The radio as CHIRP names it (`uv run tools/chirp_model.py --list`), or "none" if it's programmed another way.
      placeholder: Baofeng UV-5R
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model file
      description: Paste the model file, or attach it.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample export
      description: Attach a CSV exported from CHIRP (or the radio's own software) after loading an rflib export into the radio, so the round trip can be checked. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: checked
    attributes:
      label: What you checked
      description: For example, bands and power levels against the manual, names on the display, or transmit on each band.
  - type: textarea
    id: version
    attributes:
      label: rflib version
      description: Paste what `rflib version` prints.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Sharing
      options:
        - label: I made this model and the sample myself, and they can be published with rflib.
          required: true
