name: Release

# A tag such as v0.1.0 builds rflib for every system it's released for
# (see tools/dist) and publishes a GitHub release with the archives and
# their checksums.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "rflib $GITHUB_REF_NAME" \
            --notes "Download the archive for your system, then see [Install](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#install) in the README. The binaries aren't signed, so Windows and macOS warn the first time; the README says how to run them anyway." \
            --generate-notes
