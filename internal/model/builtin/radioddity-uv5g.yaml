name: radioddity-uv5g
description: Radioddity / Baofeng UV-5G (GMRS)
format: chirp
chirp_model: Radioddity UV-5G
memories: {first: 0, last: 127}
names: {max_length: 7, charset: upper_numeric, extra: "!@#$%^&*()+-=[]:\";'<>?,./"}
power:
  - {label: Low, watts: 1, intent: low}
  - {label: High, watts: 4, intent: high}
bands_mhz: [[130, 176], [400, 520]]
notes: Memories are numbered from 0, as CHIRP does for this radio.
source: CHIRP driver source, kk7ds/chirp commit 33d2528 (2026-10-10), drivers/uv5r.py (RadioddityUV5GRadio, BaofengUV5R)
