openapi: 3.0.3
info:
  title: rflib API
  version: "1"
  description: |
    rflib's JSON HTTP API: libraries of radio channels, the radios they're
    programmed into, saved searches, and the shared channel list.

    Frequencies are exact integer Hz. Tones are `none`, `ctcss:100.000`,
    `dcs:023`, or `dcs:023:inverted`. Queries use rflib's search language
    (`band:2m is:repeater`, `in:shared`, `status:off-air`; see the README).
    A library is named by its name or ID; a channel by its ID or a unique
    prefix of four or more characters.

    Errors are `{"error": {"code", "message"}}`: 400 `invalid` for a request
    to fix, 401 `unauthorized`, 403 `read_only` for everyday changes to the
    shared library and `forbidden` for what the signed-in user's role
    doesn't allow, 404 `not_found`, 409 `conflict` for a name in use,
    `no_draft` for a change to a radio's list with no draft open, and
    `stale_draft` for a change made against a draft that's no longer the
    one open, 413 `too_large`, 429 `too_many`, and 500 `internal`.

    A server runs in one of two ways. Without accounts, a request sends
    the server's token, if it has one, as `Authorization: Bearer TOKEN`.
    With accounts (`rflib serve --accounts`), a browser signs in
    (`POST /auth/signin`), which sets a session cookie; a member sees only
    their own library and the shared list, which they read, and an admin
    also changes the shared list. A request a browser sends from another
    site's page (by `Sec-Fetch-Site`, or a change's `Origin`) is refused
    (403 `forbidden`).

    Changes to a radio's list (its channels, sections, and sources, and
    sync) go to its open draft, which saving makes the radio's. With no
    draft open, such a change is refused (`no_draft`): start one with
    `POST .../draft`, make the changes, then `POST .../draft/save` (or
    `.../draft/discard`). Reads of the list show the draft while one is
    open; exports, copies, and other radios' comparisons use the saved
    radio. Settings save at once.

    Optionally, a change can send `X-Rflib-Draft`, as the web interface
    does. With it, a change opens a draft when none is open. Its value
    says what the client was showing: a draft's ID, or `none` for the saved
    radio, and the change is refused (`stale_draft`) when the open draft
    isn't that one, so a page that's out of date doesn't change a draft it
    hasn't seen; or `any`, from a client that wasn't showing the radio's
    list, for no such check. The response to a change names, in the same
    header, the draft it went to.
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []

paths:
  /health:
    get:
      summary: Report that the server and its database are ready, and which rflib it is
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {type: string, enum: [ok]}
                  version: {type: string, description: "rflib's version, and the commit when known, as rflib version prints it: v0.1.0, or dev (1a2b3c4d)"}
        "500": {$ref: "#/components/responses/Error"}
  /openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema: {type: object}

  /auth:
    get:
      summary: Say whether the server has accounts, who may register, and who is signed in
      security: []
      responses:
        "200":
          description: The server's sign-in
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts: {type: boolean, description: "Whether the server has accounts (rflib serve --accounts); without them, it uses a token or none"}
                  signup: {type: string, enum: [open, invite, closed], description: "Who may register, with accounts"}
                  user: {$ref: "#/components/schemas/User"}
        default: {$ref: "#/components/responses/Error"}
  /auth/signin:
    post:
      summary: Sign in, setting the session cookie
      description: Repeated failures for a name or from one address are refused for a while (429 `too_many`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: {type: string, description: "A callsign or username, ignoring case"}
                password: {type: string}
      responses:
        "200": {$ref: "#/components/responses/SignedIn"}
        default: {$ref: "#/components/responses/Error"}
  /auth/register:
    post:
      summary: Make an account, as the server's sign-up allows, and sign in
      description: "The account gets its own library, named after it. With sign-up by invitation, it needs an invitation code from an admin (rflib user invite)."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: {type: string, description: "A callsign or username: 3 to 32 letters, digits, dots, dashes, or underscores"}
                password: {type: string, minLength: 10}
                display_name: {type: string}
                email: {type: string}
                invite: {type: string, description: An invitation code}
      responses:
        "201": {$ref: "#/components/responses/SignedIn"}
        default: {$ref: "#/components/responses/Error"}
  /auth/signout:
    post:
      summary: Sign out, ending the session
      security: []
      responses:
        "204": {description: Signed out}
        default: {$ref: "#/components/responses/Error"}
  /auth/me:
    patch:
      summary: Change the signed-in user's display name or email
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string}
                email: {type: string}
      responses:
        "200": {$ref: "#/components/responses/SignedIn"}
        default: {$ref: "#/components/responses/Error"}
  /auth/password:
    post:
      summary: Change the signed-in user's password, signing out their other sessions
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, password]
              properties:
                current: {type: string}
                password: {type: string, minLength: 10}
      responses:
        "204": {description: Changed}
        default: {$ref: "#/components/responses/Error"}

  /libraries:
    get:
      summary: "List libraries: the user's own and the shared list"
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries: {type: array, items: {$ref: "#/components/schemas/Library"}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}:
    parameters: [{$ref: "#/components/parameters/lib"}]
    get:
      summary: Get a library
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Library"}
        default: {$ref: "#/components/responses/Error"}

  /libraries/{lib}/channels:
    parameters: [{$ref: "#/components/parameters/lib"}]
    get:
      summary: List or search channels
      parameters:
        - {name: q, in: query, description: "A query; in:shared searches the whole shared list", schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 0}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: more_in_shared, in: query, description: "Also count the shared channels a search of what's in use (or in:mine) leaves out", schema: {type: boolean}}
        - {name: hide_retired, in: query, description: "As the main channel list: leave out retired channels unless the search (or a saved search it uses) says status:", schema: {type: boolean}}
      responses:
        "200":
          description: Channels in name order, and how many matched before limit and offset
          content:
            application/json:
              schema:
                type: object
                required: [channels, total, more_in_shared, retired_hidden]
                properties:
                  channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
                  total: {type: integer}
                  more_in_shared: {type: integer, description: "With more_in_shared: matches in the shared list the search leaves out, less channels you've copied; else 0"}
                  retired_hidden: {type: integer, description: "With hide_retired: the retired channels left out; else 0"}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Create a channel
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChannelInput"}
      responses:
        "201":
          description: Created, with band-plan warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/{id}:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/id"}]
    get:
      summary: Get a channel
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Change a channel's fields
      description: |
        Only the fields given change; null clears tx_hz and location. A
        link can change only its own tags, notes, skip, power, and short
        names. In the shared library this is a maintainer correction and
        needs a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/ChannelInput"}
              properties:
                reason: {type: string}
      responses:
        "200":
          description: Updated, with band-plan warnings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/{id}/history:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/id"}]
    get:
      summary: A shared channel's revisions
      responses:
        "200":
          description: Revisions, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions: {type: array, items: {$ref: "#/components/schemas/Revision"}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/{id}/status:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/id"}]
    post:
      summary: Set a channel's status
      description: "Channels are retired, never deleted. In the shared library this is the maintainer's, and needs a reason; in a private library it's for the library's own channels (a shared channel's status is the shared list's)."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StatusInput"}
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Channel"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/bulk-update:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Change many channels at once
      description: Only tags, skip, power, service, rx_only, and location; all or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [select, edit]
              properties:
                select: {$ref: "#/components/schemas/Selection"}
                edit: {$ref: "#/components/schemas/ChannelEdit"}
                dry_run: {type: boolean}
      responses:
        "200":
          description: The channels as changed (or as they would be)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/bulk-status:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Set many channels' status at once (see the single channel's status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [select, status]
              properties:
                select: {$ref: "#/components/schemas/Selection"}
                status: {type: string, enum: [active, off-air, retired]}
                note: {type: string}
                back_on: {type: string, format: date, nullable: true, description: For off-air}
                replaced_by: {type: string, description: "For retired: the channel that replaces them"}
                reason: {type: string, description: "Why; needed in the shared library"}
      responses:
        "200":
          description: The channels as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/relink:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Move retired channels over to their replacements
      description: "Each selected retired channel that names a replacement gives its places on the library's radios (keeping their overrides) and, for a shared channel, your tags and notes to it."
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SelectInput"}
      responses:
        "200":
          description: What moved, and the selected channels left as they were (not retired with a replacement)
          content:
            application/json:
              schema:
                type: object
                required: [relinked, left]
                properties:
                  relinked:
                    type: array
                    items:
                      type: object
                      required: [from, to]
                      properties:
                        from: {$ref: "#/components/schemas/Channel"}
                        to: {$ref: "#/components/schemas/Channel"}
                  left: {type: array, items: {$ref: "#/components/schemas/Channel"}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/channels/copy:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Make private channels you can edit from shared ones; each takes its shared channel's place on radios
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SelectInput"}
      responses:
        "200":
          description: The copies
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}

  /libraries/{lib}/shared/convert:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Replace private channels with the shared channels they match; each shared channel takes its place on radios
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: {type: boolean}
                ids: {type: array, items: {type: string}, description: "Only these private channels (by full ID); default all"}
      responses:
        "200":
          description: What was replaced (or would be)
          content:
            application/json:
              schema:
                type: object
                required: [conversions]
                properties:
                  conversions: {type: array, items: {$ref: "#/components/schemas/Conversion"}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/shared/changes:
    parameters: [{$ref: "#/components/parameters/lib"}]
    get:
      summary: Shared channels in use (on radios, or annotated) that changed since acknowledged
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes: {type: array, items: {$ref: "#/components/schemas/Change"}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/shared/ack:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Mark shared channels' changes as seen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SelectInput"}
      responses:
        "200":
          description: Shared channels acknowledged
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/shared/relink:
    parameters: [{$ref: "#/components/parameters/lib"}]
    post:
      summary: Move retired shared channels' places on radios, and annotations, over to their replacements
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SelectInput"}
      responses:
        "200":
          description: The replacements, as the library now sees them
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/feed:
    parameters: [{$ref: "#/components/parameters/lib"}]
    get:
      summary: Channels changed since a cursor (shared channels have revisions)
      parameters:
        - {name: since, in: query, description: "A cursor from a previous response; absent for everything", schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Changed channels, and the cursor to ask with next time
          content:
            application/json:
              schema:
                type: object
                required: [channels, cursor]
                properties:
                  channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
                  cursor: {type: string, format: date-time}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/imports/{format}:
    parameters:
      - {$ref: "#/components/parameters/lib"}
      - {name: format, in: path, required: true, schema: {type: string, enum: [csv, json, chirp, profile]}}
      - {name: profile, in: query, description: "A profile name, for the profile format", schema: {type: string}}
      - {name: on_duplicate, in: query, schema: {type: string, enum: [skip, update, create]}}
      - {name: match, in: query, schema: {type: string, enum: [exact, programmed]}}
      - {name: tags, in: query, description: "Comma-separated tags for every channel", schema: {type: string}}
      - {name: service, in: query, schema: {type: string}}
      - {name: rx_only, in: query, schema: {type: boolean}}
      - {name: dry_run, in: query, schema: {type: boolean}}
      - {name: skip_invalid, in: query, schema: {type: boolean}}
      - {name: reason, in: query, description: "Needed for the shared library", schema: {type: string}}
    post:
      summary: Import a file, all or nothing
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string}
          application/json:
            schema: {type: object}
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: What the import did (or would)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/exports/{format}:
    parameters:
      - {$ref: "#/components/parameters/lib"}
      - {name: format, in: path, required: true, schema: {type: string, enum: [csv, json, chirp, profile]}}
      - {name: q, in: query, schema: {type: string}}
      - {name: profile, in: query, schema: {type: string}}
      - {name: sort, in: query, schema: {type: string, enum: [name, freq]}}
      - {name: start, in: query, schema: {type: integer}}
      - {name: max_name_len, in: query, schema: {type: integer}}
      - {name: dedupe, in: query, schema: {type: string, enum: [none, index, freq]}}
      - {name: skip_invalid, in: query, schema: {type: boolean}}
    get:
      summary: Export channels as a file
      responses:
        "200":
          description: The file. X-Rflib-Count, X-Rflib-Skipped, and X-Rflib-Duplicate-Name describe it.
          headers:
            X-Rflib-Count: {schema: {type: integer}}
          content:
            text/csv:
              schema: {type: string}
            application/json:
              schema: {type: object}
        default: {$ref: "#/components/responses/Error"}

  /libraries/{lib}/searches:
    parameters: [{$ref: "#/components/parameters/lib"}]
    get:
      summary: List saved searches with their match counts
      responses:
        "200":
          description: Searches
          content:
            application/json:
              schema:
                type: object
                required: [searches]
                properties:
                  searches: {type: array, items: {$ref: "#/components/schemas/Search"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Save a search
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchInput"}
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Search"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/searches/{name}:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/name"}]
    get:
      summary: Get a saved search and what uses it
      responses:
        "200":
          description: The search
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Search"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Change a saved search
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SearchInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Search"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a saved search nothing uses
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}

  /libraries/{lib}/radios:
    parameters: [{$ref: "#/components/parameters/lib"}]
    get:
      summary: List radios
      responses:
        "200":
          description: Radios
          content:
            application/json:
              schema:
                type: object
                required: [radios]
                properties:
                  radios: {type: array, items: {$ref: "#/components/schemas/Radio"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add a radio
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RadioInput"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Radio"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    get:
      summary: Get a radio
      responses:
        "200":
          description: The radio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Radio"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Change a radio's settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RadioInput"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Radio"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a radio; its channels stay
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/memories:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    get:
      summary: Each memory as it will be programmed
      parameters:
        - {name: q, in: query, description: "A query on the memories' channels; memory numbers and warnings stay the whole radio's", schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/Memories"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Append channels to a section of the radio's list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: {type: array, items: {type: string}}
                query: {type: string}
                sort: {type: string, enum: [name, freq]}
                section: {type: string, description: "A section's ID or name; the radio's default section when absent"}
                any_band: {type: boolean}
                any_mode: {type: boolean}
      responses:
        "200":
          description: What was added and skipped
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels/remove:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Take channels off the radio; they stay in the library
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SelectInput"}
      responses:
        "200":
          description: The channels taken off (or that would be)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels/set:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Set power or scan overrides on many channels on the radio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [select]
              properties:
                select: {$ref: "#/components/schemas/Selection"}
                power: {type: string, nullable: true}
                scan: {type: boolean, nullable: true}
      responses:
        "200":
          description: The channels changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChannelsResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels/keep:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Keep channels a source added, even if it stops matching them
      description: They then count as added by hand, so no sync takes them off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids: {type: array, items: {type: string}, minItems: 1}
      responses:
        "200": {$ref: "#/components/responses/Memories"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels/move:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Move several channels to the end of a section, in their order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids, section]
              properties:
                ids: {type: array, items: {type: string}, minItems: 1}
                section: {type: string, description: "A section's ID or name"}
      responses:
        "200": {$ref: "#/components/responses/Memories"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels/{id}:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/id"}]
    patch:
      summary: Set the radio's overrides for one channel; null removes one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, nullable: true}
                power: {type: string, nullable: true}
                scan: {type: boolean, nullable: true}
      responses:
        "200": {$ref: "#/components/responses/Memories"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/channels/{id}/move:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/id"}]
    post:
      summary: Move a channel within the radio's list
      description: >-
        Into a section (by ID or name; its own when absent), before or after
        another channel (into that channel's section), to a position in the
        section, or to its top or bottom; a section alone puts it at the
        bottom. Placing a channel in a section sorted by name or freq makes
        the section manual, in the order it had.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: A section, or one of the others (to, top, and bottom with a section)
              properties:
                section: {type: string}
                before: {type: string}
                after: {type: string}
                to: {type: integer, minimum: 1, description: Position in the section}
                top: {type: boolean}
                bottom: {type: boolean}
      responses:
        "200": {$ref: "#/components/responses/Memories"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sources:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    get:
      summary: The radio's sources
      responses:
        "200": {$ref: "#/components/responses/Sources"}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add a source to the end
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourceInput"}
      responses:
        "201": {$ref: "#/components/responses/Sources"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sources/preview:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Preview what a source would add, without changing anything
      description: >-
        The channels a sync would add for the source: those it matches that
        aren't on the radio, after earlier sources claim theirs, and those it
        skips for the radio's bands or modes. A new source is previewed at the
        end; with number, that existing source is previewed in its place with
        the changes given.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourcePreviewInput"}
      responses:
        "200":
          description: What the source would add
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sources/{n}:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/n"}]
    patch:
      summary: Change a source
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourceInput"}
      responses:
        "200": {$ref: "#/components/responses/Sources"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove a source; its channels stay unless with_channels
      parameters:
        - {name: with_channels, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: How many channels came off
          content:
            application/json:
              schema:
                type: object
                required: [channels_removed]
                properties:
                  channels_removed: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sources/{n}/move:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/n"}]
    post:
      summary: Move a source; earlier sources claim channels first
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: {type: integer, minimum: 1}
      responses:
        "200": {$ref: "#/components/responses/Sources"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sections:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    get:
      summary: The radio's sections, as laid out
      responses:
        "200": {$ref: "#/components/responses/Sections"}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add a section, before the default section when that is last
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{$ref: "#/components/schemas/SectionInput"}]
              required: [name]
      responses:
        "201": {$ref: "#/components/responses/Sections"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sections/{section}:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/section"}]
    patch:
      summary: Change a section; absent fields stay, null takes a start or size away
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SectionInput"}
      responses:
        "200": {$ref: "#/components/responses/Sections"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a section other than the default, and the sources that feed it
      description: >-
        The sources that feed it go with it (their channels elsewhere stay, as
        if added by hand). Its channels come off the radio with take_off;
        otherwise they go to the end of the default section.
      parameters:
        - {name: take_off, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: The sections now, and what went with it
          content:
            application/json:
              schema:
                type: object
                required: [sections, sources_removed, taken_off]
                properties:
                  sections: {type: array, items: {$ref: "#/components/schemas/Section"}}
                  sources_removed: {type: array, items: {$ref: "#/components/schemas/Source"}}
                  taken_off: {type: integer}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sections/{section}/merge:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/section"}]
    post:
      summary: Merge a section into another
      description: >-
        Its channels go to the end of the other section, in their order (or
        the other's sort), its sources feed the other, and it goes. Merging
        the default section makes the other the default. A section whose
        start the other's growth leaves behind loses its start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [into]
              properties:
                into: {type: string, description: "The other section's ID or name"}
      responses:
        "200":
          description: The sections now, and how many channels moved
          content:
            application/json:
              schema:
                type: object
                required: [sections, moved, starts_cleared]
                properties:
                  sections: {type: array, items: {$ref: "#/components/schemas/Section"}}
                  moved: {type: integer}
                  starts_cleared: {type: array, items: {type: string}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sections/{section}/move:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}, {$ref: "#/components/parameters/section"}]
    post:
      summary: Move a section among the radio's sections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to]
              properties:
                to: {type: integer, minimum: 1}
      responses:
        "200": {$ref: "#/components/responses/Sections"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/sync:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Add new channels matching the radio's sources
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: {type: boolean}
                any_band: {type: boolean}
                any_mode: {type: boolean}
      responses:
        "200":
          description: What the sync did (or would)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncResult"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/copy:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Make a new radio from this one as it is now, for another model
      description: >-
        The new radio gets this one's sections (in order, with their starts,
        sizes, and orders), sources, channels in their sections and order,
        and overrides. Channels the new model can't use are left out. Unset
        settings come from this radio. From then on the two are independent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{$ref: "#/components/schemas/RadioInput"}]
              required: [name, model]
      responses:
        "201":
          description: The new radio, and what came across
          content:
            application/json:
              schema:
                type: object
                required: [radio, copied, skipped, layout_error]
                properties:
                  radio: {$ref: "#/components/schemas/Radio"}
                  copied: {type: integer}
                  skipped: {type: array, items: {$ref: "#/components/schemas/Channel"}, description: "Channels the new model can't use"}
                  layout_error: {type: string, nullable: true, description: "Set when the copy doesn't lay out on the new model, such as a section past its last memory"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/compare-radio:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Compare this radio with another, by channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [radio]
              properties:
                radio: {type: string, description: "The other radio's name or ID"}
      responses:
        "200":
          description: How many channels both have, what only the other has, and what only this one has
          content:
            application/json:
              schema:
                type: object
                required: [other, same, missing, extra]
                properties:
                  other: {type: string}
                  same: {type: integer}
                  missing:
                    type: array
                    items:
                      type: object
                      required: [channel, section, name, unusable]
                      properties:
                        channel: {$ref: "#/components/schemas/Channel"}
                        section: {type: string, description: "The other radio's section for it"}
                        name: {type: string, description: "The other radio's name override for it"}
                        unusable: {type: string, nullable: true, description: "Why this radio's model can't use it"}
                  extra: {type: array, items: {$ref: "#/components/schemas/Channel"}}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/compare-radio/apply:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Add channels another radio has and this one doesn't
      description: >-
        In the other radio's order, each into this radio's section of the
        same name, with the other radio's overrides for it. A section this
        radio lacks is made as the other has it, at the end, without its
        start if that doesn't fit there; new channels that would push one of
        this radio's sections into a later start go to a section of their
        own at the end. Nothing already on this radio moves. Without add,
        every one this radio can use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [radio]
              properties:
                radio: {type: string}
                add: {type: array, items: {type: string}, description: "Channel IDs; all usable ones when absent"}
                dry_run: {type: boolean}
      responses:
        "200":
          description: The channels added (or that would be)
          content:
            application/json:
              schema:
                type: object
                required: [added, new_sections, unstarted, overflowed, dry_run]
                properties:
                  added: {type: array, items: {$ref: "#/components/schemas/Channel"}}
                  new_sections: {type: array, items: {type: string}, description: "Sections made for them, as the other radio has them"}
                  unstarted: {type: array, items: {type: string}, description: "Sections made without their start, which didn't fit here"}
                  overflowed: {type: array, items: {type: string}, description: "This radio's sections whose new channels would have run into a later section's start, so went to a section of their own at the end"}
                  dry_run: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/compare:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Compare a radio with a file of what it holds
      description: >-
        file is what the radio holds, as its programming software or CHIRP
        saved it. Each memory is same, changed (rflib has it there, but the
        radio's differs), radio (only on the radio, with channels it might
        be), or rflib (only in rflib; the next export programs it).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompareInput"}
      responses:
        "200":
          description: The comparison, by memory number
          content:
            application/json:
              schema:
                type: object
                required: [memories, errors]
                properties:
                  memories: {type: array, items: {$ref: "#/components/schemas/MemoryDiff"}}
                  errors: {type: array, items: {type: string}, description: File rows that couldn't be read}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/compare/apply:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Bring rflib in line with a radio's file
      description: >-
        Compares again, then applies the decisions in one go. use puts a
        channel on the radio for a memory only on the radio, and keep a
        private channel made from the memory; each keeps its memory number
        when rflib has nothing there, else goes at the end. take gives rflib
        a changed memory's values: a private channel changes, a shared one is
        copied first, and a name or skip becomes the radio's own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: {type: string}
                ignore_numbers: {type: boolean, description: "As for compare; used and kept memories then go at the end of the list"}
                use:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [memory, channel_id]
                    properties:
                      memory: {type: integer}
                      channel_id: {type: string}
                keep: {type: array, items: {type: integer}}
                take: {type: array, items: {type: integer}}
                dry_run: {type: boolean}
      responses:
        "200":
          description: What was (or would be) done
          content:
            application/json:
              schema:
                type: object
                required: [used, kept, taken, at_end, copied, dry_run]
                properties:
                  used: {type: integer}
                  kept: {type: integer}
                  taken: {type: integer}
                  at_end: {type: array, items: {type: string}, description: "Memories placed at the end, because rflib uses their numbers"}
                  copied: {type: array, items: {type: string}, description: "Shared channels copied to take the radio's values"}
                  dry_run: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/export:
    parameters:
      - {$ref: "#/components/parameters/lib"}
      - {$ref: "#/components/parameters/radio"}
      - {name: skip_invalid, in: query, schema: {type: boolean}}
      - {name: reason, in: query, description: "Why, for the revision the export saves when the radio changed since its last one (by default the day and \"saved automatically by an export\")", schema: {type: string}}
    get:
      summary: The radio's programming file
      description: "From the saved radio. An export counts as programming the radio: when the radio differs from its last revision, it's saved as a new one, marked exported; otherwise the last one is marked exported."
      responses:
        "200":
          description: A CSV for CHIRP or the radio's programming software. X-Rflib-Warning headers carry the plan's warnings.
          headers:
            X-Rflib-Count: {schema: {type: integer}}
            X-Rflib-Revision: {description: The revision the export is, schema: {type: integer}}
            X-Rflib-Revision-Saved: {description: "true when the export saved that revision", schema: {type: string}}
          content:
            text/csv:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/draft:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    get:
      summary: The radio's open draft, and what it changes
      responses:
        "200":
          description: The draft (null when none is open) and its changes against the saved radio
          content:
            application/json:
              schema:
                type: object
                required: [draft, changes]
                properties:
                  draft: {$ref: "#/components/schemas/Draft"}
                  changes: {$ref: "#/components/schemas/ListChanges"}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Open the radio's draft, a copy of its list as it is now
      responses:
        "201":
          description: The draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/revisions:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    get:
      summary: The radio's revisions, oldest first
      responses:
        "200":
          description: The revisions
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions: {type: array, items: {$ref: "#/components/schemas/RadioRevision"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Save the saved radio as a revision (refused when nothing changed since the last)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        "201":
          description: The revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadioRevision"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/revisions/{n}/compare:
    parameters:
      - {$ref: "#/components/parameters/lib"}
      - {$ref: "#/components/parameters/radio"}
      - {name: n, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      summary: Compare a revision with the radio as it is now (its open draft, if any)
      responses:
        "200":
          description: What changed since the revision
          content:
            application/json:
              schema:
                type: object
                required: [revision, changes]
                properties:
                  revision: {$ref: "#/components/schemas/RadioRevision"}
                  changes: {$ref: "#/components/schemas/ListChanges"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/revisions/{n}/restore:
    parameters:
      - {$ref: "#/components/parameters/lib"}
      - {$ref: "#/components/parameters/radio"}
      - {name: n, in: path, required: true, schema: {type: integer, minimum: 1}}
    post:
      summary: Put a revision's list into the radio's draft
      description: "Its sections, sources, and memories, to review and save or discard; settings stay. With a draft open, it's refused (conflict) unless replace_draft."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                replace_draft: {type: boolean}
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Draft"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/draft/save:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Make the radio's list its draft's, and close the draft
      responses:
        "200":
          description: The radio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Radio"}
        default: {$ref: "#/components/responses/Error"}
  /libraries/{lib}/radios/{radio}/draft/discard:
    parameters: [{$ref: "#/components/parameters/lib"}, {$ref: "#/components/parameters/radio"}]
    post:
      summary: Close the radio's draft, leaving the radio as it was
      responses:
        "200":
          description: The radio
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Radio"}
        default: {$ref: "#/components/responses/Error"}

  /organizations:
    get:
      summary: The shared list's organizations
      responses:
        "200":
          description: Organizations by name
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations: {type: array, items: {$ref: "#/components/schemas/Organization"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add an organization (maintainer)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganizationInput"}
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
        default: {$ref: "#/components/responses/Error"}
  /organizations/{org}:
    parameters: [{$ref: "#/components/parameters/org"}]
    get:
      summary: An organization and the shared channels and systems it's part of
      responses:
        "200":
          description: The organization
          content:
            application/json:
              schema:
                type: object
                required: [organization, channels, systems]
                properties:
                  organization: {$ref: "#/components/schemas/Organization"}
                  channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
                  systems: {type: array, items: {$ref: "#/components/schemas/System"}}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Change an organization (maintainer)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganizationInput"}
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Organization"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete an organization attached to nothing (maintainer)
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /organizations/{org}/history:
    parameters: [{$ref: "#/components/parameters/org"}]
    get:
      summary: An organization's revisions
      responses:
        "200": {$ref: "#/components/responses/RecordRevisions"}
        default: {$ref: "#/components/responses/Error"}
  /systems:
    get:
      summary: The shared list's systems of linked channels
      responses:
        "200":
          description: Systems by name
          content:
            application/json:
              schema:
                type: object
                required: [systems]
                properties:
                  systems: {type: array, items: {$ref: "#/components/schemas/System"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Add a system (maintainer)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemInput"}
      responses:
        "201": {$ref: "#/components/responses/SystemDetail"}
        default: {$ref: "#/components/responses/Error"}
  /systems/{system}:
    parameters: [{$ref: "#/components/parameters/system"}]
    get:
      summary: A system and its members' channels
      responses:
        "200": {$ref: "#/components/responses/SystemDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Change a system (maintainer)
      description: Lists given replace the system's own.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemInput"}
      responses:
        "200": {$ref: "#/components/responses/SystemDetail"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete a system; its channels stay (maintainer)
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /systems/{system}/history:
    parameters: [{$ref: "#/components/parameters/system"}]
    get:
      summary: A system's revisions
      responses:
        "200": {$ref: "#/components/responses/RecordRevisions"}
        default: {$ref: "#/components/responses/Error"}
  /plans:
    get:
      summary: The shared list's communications plans
      responses:
        "200":
          description: Plans by name
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans: {type: array, items: {$ref: "#/components/schemas/Plan"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Start a plan (maintainer)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanInput"}
      responses:
        "201": {$ref: "#/components/responses/PlanDetail"}
        default: {$ref: "#/components/responses/Error"}
  /plans/{plan}:
    parameters: [{$ref: "#/components/parameters/plan"}]
    get:
      summary: A plan and its channels as ICS 205 lists them
      responses:
        "200": {$ref: "#/components/responses/PlanDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Change a plan (maintainer); plans are archived, never deleted
      description: Entries given replace the plan's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlanInput"}
      responses:
        "200": {$ref: "#/components/responses/PlanDetail"}
        default: {$ref: "#/components/responses/Error"}
  /plans/{plan}/history:
    parameters: [{$ref: "#/components/parameters/plan"}]
    get:
      summary: A plan's revisions
      responses:
        "200": {$ref: "#/components/responses/RecordRevisions"}
        default: {$ref: "#/components/responses/Error"}
  /models:
    get:
      summary: Radio models
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models: {type: array, items: {$ref: "#/components/schemas/Model"}}
        default: {$ref: "#/components/responses/Error"}
  /models/{name}:
    parameters: [{$ref: "#/components/parameters/name"}]
    get:
      summary: A radio model
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        default: {$ref: "#/components/responses/Error"}
  /profiles:
    get:
      summary: Export profiles
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      type: object
                      required: [name, description, built_in]
                      properties:
                        name: {type: string}
                        description: {type: string}
                        built_in: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /seeds:
    get:
      summary: Built-in channel lists
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: object
                required: [seeds]
                properties:
                  seeds: {type: array, items: {$ref: "#/components/schemas/Seed"}}
        default: {$ref: "#/components/responses/Error"}
  /seeds/{seed}:
    parameters: [{$ref: "#/components/parameters/seed"}]
    get:
      summary: A built-in list and its channels
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Seed"}
        default: {$ref: "#/components/responses/Error"}
  /seeds/{seed}/update:
    parameters: [{$ref: "#/components/parameters/seed"}]
    post:
      summary: Bring the shared list up to date with a built-in list (maintainer)
      description: >-
        Adds the list's new channels, applies what the list changed since it
        was last applied, and retires channels it dropped. A field a
        maintainer corrected is kept, and listed in kept. With dry_run,
        reports the changes without making them.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run: {type: boolean}
      responses:
        "200":
          description: The changes made (or that would be)
          content:
            application/json:
              schema:
                type: object
                required: [installed, dry_run, changes]
                properties:
                  installed: {type: boolean}
                  dry_run: {type: boolean}
                  changes:
                    type: array
                    items:
                      type: object
                      required: [kind, name, fields, kept, channel]
                      properties:
                        kind: {type: string, enum: [add, update, drop]}
                        name: {type: string}
                        fields: {type: array, items: {type: string}, description: Fields an update changes}
                        kept: {type: array, items: {type: string}, description: "Fields the list changed that a maintainer corrected, kept as corrected"}
                        channel: {$ref: "#/components/schemas/Channel"}
        default: {$ref: "#/components/responses/Error"}
  /tags:
    get:
      summary: The shared tags and what they mean
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      required: [name, meaning]
                      properties:
                        name: {type: string}
                        meaning: {type: string}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Required when the server has a token ($RFLIB_API_TOKEN) and no accounts.
    session:
      type: apiKey
      in: cookie
      name: rflib_session
      description: "On a server with accounts (rflib serve --accounts): the session cookie that signing in sets."

  parameters:
    lib: {name: lib, in: path, required: true, description: "A library's name or ID", schema: {type: string}}
    id: {name: id, in: path, required: true, description: "A channel's ID or unique prefix", schema: {type: string}}
    radio: {name: radio, in: path, required: true, description: "A radio's name or ID", schema: {type: string}}
    section: {name: section, in: path, required: true, description: "A section's ID, unique ID prefix, or name", schema: {type: string}}
    name: {name: name, in: path, required: true, schema: {type: string}}
    seed: {name: seed, in: path, required: true, description: "A built-in list, such as us-gmrs", schema: {type: string}}
    n: {name: n, in: path, required: true, description: "A source's number, from 1", schema: {type: integer, minimum: 1}}
    org: {name: org, in: path, required: true, description: "An organization's name or ID", schema: {type: string}}
    system: {name: system, in: path, required: true, description: "A system's name or ID", schema: {type: string}}
    plan: {name: plan, in: path, required: true, description: "A plan's name or ID", schema: {type: string}}

  responses:
    SignedIn:
      description: The signed-in user
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: {$ref: "#/components/schemas/User"}
    Error:
      description: An error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Memories:
      description: Each memory as it will be programmed, and the plan's warnings
      content:
        application/json:
          schema:
            type: object
            required: [memories, sections, warnings]
            properties:
              memories: {type: array, items: {$ref: "#/components/schemas/Memory"}}
              sections: {type: array, items: {$ref: "#/components/schemas/Section"}}
              warnings: {type: array, items: {type: string}}
              starts_cleared: {type: array, items: {type: string}, description: "After a move: sections whose start it left behind the memories before them, which now follow the section before them"}
    Sections:
      description: The radio's sections, as laid out
      content:
        application/json:
          schema:
            type: object
            required: [sections]
            properties:
              sections: {type: array, items: {$ref: "#/components/schemas/Section"}}
              starts_cleared: {type: array, items: {type: string}, description: "After a move: sections whose start it left behind the memories before them, which now follow the section before them"}
    Sources:
      description: The radio's sources
      content:
        application/json:
          schema:
            type: object
            required: [sources]
            properties:
              sources: {type: array, items: {$ref: "#/components/schemas/Source"}}

    SystemDetail:
      description: A system and its members' channels, in member order
      content:
        application/json:
          schema:
            type: object
            required: [system, channels]
            properties:
              system: {$ref: "#/components/schemas/System"}
              channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
    PlanDetail:
      description: A plan and its rows as ICS 205 lists them
      content:
        application/json:
          schema:
            type: object
            required: [plan, rows]
            properties:
              plan: {$ref: "#/components/schemas/Plan"}
              rows: {type: array, items: {$ref: "#/components/schemas/PlanRow"}}
    RecordRevisions:
      description: Revisions, oldest first
      content:
        application/json:
          schema:
            type: object
            required: [revisions]
            properties:
              revisions: {type: array, items: {$ref: "#/components/schemas/RecordRevision"}}

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [invalid, unauthorized, forbidden, read_only, not_found, conflict, no_draft, stale_draft, too_large, too_many, internal]}
            message: {type: string}

    Library:
      type: object
      required: [id, name, description, shared, default, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        shared: {type: boolean, description: The one library of shared channels}
        default: {type: boolean, description: "The user's own library, as opposed to the shared list"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    User:
      type: object
      required: [id, name, display_name, email, role, callsign, library]
      properties:
        id: {type: string}
        name: {type: string, description: What the user signs in with}
        display_name: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, member], description: "An admin also maintains the shared list"}
        callsign: {type: boolean, description: "Whether the name has a callsign's form; unverified"}
        library: {type: string, description: "The user's own library's name"}

    Location:
      type: object
      required: [latitude, longitude, radius_km]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        radius_km: {type: number, nullable: true}
    Link:
      type: object
      description: >-
        Set on a library's view of a shared channel: the shared channel's own
        tags and notes (the channel's tags, notes, and short names are the
        user's). shared_id is the channel's own id.
      required: [shared_id, tags, notes, seen_revision, changed]
      properties:
        shared_id: {type: string}
        tags: {type: array, items: {type: string}}
        notes: {type: string}
        seen_revision: {type: integer}
        changed: {type: boolean, description: The shared channel changed since acknowledged}
    Channel:
      type: object
      required: [id, name, rx_hz, tx_hz, mode, service, rx_only, rx_tone, tx_tone, tone_squelch, power, bandwidth, skip, tags, short_names, notes,
        location, status, status_note, back_on, replaced_by, revision, copied_from, link, networks, organizations, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        rx_hz: {type: integer, format: int64}
        tx_hz: {type: integer, format: int64, nullable: true, description: Null for receive-only records}
        mode: {type: string, enum: [FM, NFM, AM, USB, LSB, CW]}
        service: {type: string, description: Empty when unspecified}
        rx_only: {type: boolean}
        rx_tone: {type: string}
        tx_tone: {type: string}
        tone_squelch: {type: boolean}
        power: {type: string, enum: ["", low, medium, high, max]}
        bandwidth: {type: string}
        skip: {type: boolean}
        tags: {type: array, items: {type: string}, description: "The user's own; a link's shared tags are in link.tags"}
        short_names: {type: array, items: {type: string}}
        notes: {type: string, description: "The user's own; a link's shared notes are in link.notes"}
        location: {allOf: [{$ref: "#/components/schemas/Location"}], nullable: true}
        status: {type: string, enum: [active, off-air, retired]}
        status_note: {type: string}
        back_on: {type: string, format: date, nullable: true}
        replaced_by: {type: string, nullable: true}
        revision: {type: integer, description: A shared channel's revision; zero for private channels}
        copied_from: {type: string, nullable: true}
        link: {allOf: [{$ref: "#/components/schemas/Link"}], nullable: true}
        networks: {type: array, items: {type: string}, description: "Nodes on linking networks, NETWORK:NODE, such as allstar:43763"}
        organizations: {type: array, items: {$ref: "#/components/schemas/OrgRef"}, description: "A shared channel's organizations"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChannelInput:
      type: object
      description: Fields to set; on create, name and rx_hz are required.
      properties:
        name: {type: string}
        rx_hz: {type: integer, format: int64}
        tx_hz: {type: integer, format: int64, nullable: true}
        mode: {type: string}
        service: {type: string}
        rx_only: {type: boolean}
        rx_tone: {type: string}
        tx_tone: {type: string}
        tone_squelch: {type: boolean}
        power: {type: string}
        bandwidth: {type: string}
        skip: {type: boolean}
        tags: {type: array, items: {type: string}}
        short_names: {type: array, items: {type: string}}
        notes: {type: string}
        networks: {type: array, items: {type: string}, description: "NETWORK:NODE values; networks are allstar, echolink, irlp, and wires-x"}
        organizations: {type: array, items: {$ref: "#/components/schemas/OrgRefInput"}, description: Shared channels only}
        location:
          type: object
          nullable: true
          additionalProperties: false
          required: [latitude, longitude]
          properties:
            latitude: {type: number}
            longitude: {type: number}
            radius_km: {type: number, nullable: true}
    ChannelResult:
      type: object
      required: [channel, warnings]
      properties:
        channel: {$ref: "#/components/schemas/Channel"}
        warnings: {type: array, items: {type: string}, description: Band-plan warnings; the channel was saved}
    ChannelsResult:
      type: object
      required: [channels, warnings]
      properties:
        channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
        warnings: {type: array, items: {type: string}}
    Selection:
      type: object
      additionalProperties: false
      description: Channels by ID (or unique prefix), by query, or all; with ids and a query, a channel must match both.
      properties:
        ids: {type: array, items: {type: string}}
        query: {type: string}
        all: {type: boolean}
    SelectInput:
      type: object
      additionalProperties: false
      required: [select]
      properties:
        select: {$ref: "#/components/schemas/Selection"}
        dry_run: {type: boolean}
    ChannelEdit:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: object
          additionalProperties: false
          description: set replaces the tags; otherwise add and remove change them
          properties:
            set: {type: array, items: {type: string}}
            add: {type: array, items: {type: string}}
            remove: {type: array, items: {type: string}}
        skip: {type: boolean}
        power: {type: string}
        service: {type: string}
        rx_only: {type: boolean}
        location:
          type: object
          nullable: true
          properties:
            latitude: {type: number}
            longitude: {type: number}
            radius_km: {type: number, nullable: true}
    StatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [active, off-air, retired]}
        note: {type: string}
        back_on: {type: string, format: date, nullable: true, description: For off-air}
        replaced_by: {type: string, description: "For retired: the channel that replaces it, one of the library's own or (from a private library) a shared one"}
        reason: {type: string, description: "Why; needed in the shared library"}
    Revision:
      type: object
      required: [revision, at, reason, author, changes, channel]
      properties:
        revision: {type: integer}
        at: {type: string, format: date-time}
        reason: {type: string}
        author: {type: string}
        changes: {type: array, items: {type: string}, description: How it differs from the revision before}
        channel: {$ref: "#/components/schemas/Channel"}
    Change:
      type: object
      required: [channel, changes, reasons, radios, replacement]
      properties:
        channel: {$ref: "#/components/schemas/Channel"}
        changes: {type: array, items: {type: string}}
        reasons: {type: array, items: {type: string}}
        radios: {type: array, items: {type: string}, description: "Radios it's on, which need programming again"}
        replacement: {allOf: [{$ref: "#/components/schemas/Channel"}], nullable: true}
    Conversion:
      type: object
      required: [channel, shared, link]
      properties:
        channel: {$ref: "#/components/schemas/Channel"}
        shared: {$ref: "#/components/schemas/Channel"}
        link: {$ref: "#/components/schemas/Channel"}
    ImportResult:
      type: object
      required: [created, updated, skipped, invalid, warnings, dropped_tags, dry_run]
      properties:
        created: {type: integer}
        updated: {type: integer}
        skipped: {type: integer, description: Duplicates}
        invalid: {type: array, items: {$ref: "#/components/schemas/RowError"}}
        warnings: {type: array, items: {$ref: "#/components/schemas/RowError"}}
        dropped_tags: {type: array, items: {type: string}, description: Tags left off shared channels}
        dry_run: {type: boolean}
    RowError:
      type: object
      required: [row, message]
      properties:
        row: {type: integer}
        message: {type: string}

    Search:
      type: object
      required: [id, name, query, notes, matches, error]
      properties:
        id: {type: string}
        name: {type: string}
        query: {type: string}
        notes: {type: string}
        matches: {type: integer, nullable: true, description: Null when the search no longer works}
        error: {type: string, nullable: true}
        used_by: {type: array, items: {type: string}}
    SearchInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        query: {type: string}
        notes: {type: string}

    Radio:
      type: object
      required: [id, name, model, default_power, dedupe, name_length, notes, channels, created_at, updated_at, draft, sync_changes, revision, changed_since_revision, needs_programming]
      properties:
        id: {type: string}
        name: {type: string}
        model: {type: string}
        default_power: {type: string}
        dedupe: {type: string, enum: [none, index, freq]}
        name_length: {type: integer, description: "The radio's longest name, overriding the model's; 0 uses the model's"}
        notes: {type: string}
        channels: {type: integer, description: "Memories on the radio, or on its open draft"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        draft: {$ref: "#/components/schemas/Draft"}
        sync_changes: {type: integer, nullable: true, description: "How many channels a sync of the saved radio would add or take off; null when it has no sources or doesn't lay out"}
        revision: {type: integer, description: "The radio's latest revision; 0 for none"}
        changed_since_revision: {type: boolean, description: "The saved radio differs from its latest revision, so an export would save one"}
        needs_programming: {type: boolean, description: "The saved radio differs from its latest exported revision, including channels on it that changed since"}
    RadioRevision:
      type: object
      description: A radio as saved at one time, by hand or by an export
      required: [number, at, reason, author, exported, memories]
      properties:
        number: {type: integer}
        at: {type: string, format: date-time}
        reason: {type: string}
        author: {type: string}
        exported: {type: boolean, description: "An export saved it, or saw it"}
        memories: {type: integer}
    ListChanges:
      type: object
      description: What one list of a radio changes from another
      required: [added, removed, changed, moved, renumbered, sections_added, sections_removed, sources_added, sources_removed]
      properties:
        added: {type: array, items: {$ref: "#/components/schemas/Channel"}}
        removed: {type: array, items: {$ref: "#/components/schemas/Channel"}}
        changed: {type: array, description: "Memories with another name, power, or scan", items: {$ref: "#/components/schemas/Channel"}}
        moved: {type: array, description: Memories moved to another section, items: {$ref: "#/components/schemas/MovedMemory"}}
        renumbered: {type: array, description: Memories renumbered within their section, items: {$ref: "#/components/schemas/MovedMemory"}}
        sections_added: {type: array, items: {type: string}}
        sections_removed: {type: array, items: {type: string}}
        sources_added: {type: array, items: {type: string}}
        sources_removed: {type: array, items: {type: string}}
        channels:
          type: array
          description: "Comparing with a revision: channels whose own values changed since, and how"
          items:
            type: object
            required: [channel, changes]
            properties:
              channel: {$ref: "#/components/schemas/Channel"}
              changes: {type: array, items: {type: string}}
    MovedMemory:
      type: object
      description: "A memory a draft moves: its number (null when not programmed) and section, before and after"
      required: [channel, from, to, from_section, to_section]
      properties:
        channel: {$ref: "#/components/schemas/Channel"}
        from: {type: integer, nullable: true}
        to: {type: integer, nullable: true}
        from_section: {type: string}
        to_section: {type: string}
    Draft:
      type: object
      nullable: true
      description: A radio's open draft
      required: [id, started_at]
      properties:
        id: {type: string}
        started_at: {type: string, format: date-time}
    RadioInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        model: {type: string}
        default_power: {type: string}
        dedupe: {type: string}
        name_length: {type: integer, minimum: 0, maximum: 64}
        notes: {type: string}
    Memory:
      type: object
      required: [memory, section, plan_number, source, overflow, name, fit, deduped, power, scan, exported, not_programmed, receive_only, transmit_tone_only, overrides, channel]
      properties:
        memory: {type: integer, nullable: true, description: "The memory number on the radio; null for a memory that isn't programmed, which takes no number"}
        section: {type: string, description: "The ID of the section the memory is in"}
        plan_number: {type: integer, nullable: true, description: "A plan source's Ch # for the memory"}
        source: {type: integer, nullable: true, description: "The number of the source that added it, which a sync takes it off when it no longer matches; null when added by hand (or kept)"}
        overflow: {type: boolean, description: "Past the end of its section's size, so spilling into the memories after it"}
        name: {type: string, description: The name on the radio}
        fit: {type: string, enum: [fits, variant, shortened, cut]}
        deduped: {type: boolean}
        power: {type: string, nullable: true, description: The radio's level label}
        scan: {type: boolean}
        exported: {type: boolean, description: "Whether the radio's programming file (leaving out what it can't hold) programs this memory"}
        not_programmed: {type: string, nullable: true, description: "Why the memory isn't programmed: retired, a mode the radio lacks, or something the radio's file can't hold. It takes no number."}
        receive_only: {type: boolean, description: "Programmed receive-only: the channel is, or it can't transmit there"}
        transmit_tone_only: {type: boolean, description: "Programmed with the transmit tone alone: the radio can't hold the receive tone, such as split tones"}
        overrides:
          type: object
          required: [name, power, scan]
          properties:
            name: {type: boolean}
            power: {type: boolean}
            scan: {type: boolean}
        channel: {$ref: "#/components/schemas/Channel"}
    CompareInput:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, description: "The radio's file, as its programming software or CHIRP saved it"}
        ignore_numbers: {type: boolean, description: "Compare only what memories hold, wherever they are: for a first import into a radio rflib lays out its own way"}
    MemoryValues:
      type: object
      required: [name, rx_hz, tx_hz, mode, rx_tone, tx_tone, tone_squelch, skip]
      properties:
        name: {type: string}
        rx_hz: {type: integer, format: int64}
        tx_hz: {type: integer, format: int64, nullable: true}
        mode: {type: string}
        rx_tone: {type: string}
        tx_tone: {type: string}
        tone_squelch: {type: boolean}
        skip: {type: boolean}
    MemoryDiff:
      type: object
      required: [memory, status, rflib_memory, radio, rflib, channel, fields, candidates, unexported]
      properties:
        memory: {type: integer, nullable: true, description: "The radio's memory number, or rflib's for status rflib; null for a memory rflib doesn't program"}
        status: {type: string, enum: [same, changed, radio, rflib]}
        rflib_memory: {type: integer, nullable: true, description: "Where rflib puts the channel, when that differs"}
        radio: {allOf: [{$ref: "#/components/schemas/MemoryValues"}], nullable: true}
        rflib: {allOf: [{$ref: "#/components/schemas/MemoryValues"}], nullable: true}
        channel: {allOf: [{$ref: "#/components/schemas/Channel"}], nullable: true}
        fields: {type: array, items: {type: string}, description: "What differs, for changed"}
        unexported: {type: string, nullable: true, description: "Why rflib's export leaves the memory out, such as tones the radio's format can't hold"}
        candidates:
          type: array
          description: Channels a memory only on the radio might be, best first
          items:
            type: object
            required: [match, channel]
            properties:
              match: {type: string, enum: [exact, frequencies, receive]}
              channel: {$ref: "#/components/schemas/Channel"}
    AddResult:
      type: object
      required: [added, channels, skipped, wrong_mode]
      properties:
        added: {type: integer, description: Channels new to the radio}
        channels: {type: array, items: {$ref: "#/components/schemas/Channel"}, description: "Channels that fit, including any already on it"}
        skipped: {type: array, items: {$ref: "#/components/schemas/Channel"}, description: Outside the radio's bands}
        wrong_mode: {type: array, items: {$ref: "#/components/schemas/Channel"}}
    Source:
      type: object
      required: [number, id, query, plan, plan_id, sort, section_id, section, plan_numbers, channels]
      properties:
        number: {type: integer}
        id: {type: string}
        query: {type: string, description: Empty for a plan source}
        plan: {type: string, nullable: true, description: A plan source's plan name}
        plan_id: {type: string, nullable: true}
        sort: {type: string, enum: [name, freq], description: "The order a sync adds channels in, in a manual section"}
        section_id: {type: string}
        section: {type: string, description: The section the source feeds}
        plan_numbers: {type: string, enum: [compact, match], description: "For a plan: its order without gaps, or memory = the section's first memory + Ch # - 1"}
        channels: {type: integer}
    Section:
      type: object
      required: [id, number, name, start, size, sort, default, first, last]
      properties:
        id: {type: string}
        number: {type: integer, description: "Its place among the radio's sections, from 1"}
        name: {type: string}
        start: {type: integer, nullable: true, description: "Its first memory; when null, it follows the section before it"}
        size: {type: integer, nullable: true, description: "Memories it reserves; more spill over with a warning"}
        sort: {type: string, enum: [manual, name, freq]}
        default: {type: boolean, description: Where channels added by hand go}
        first: {type: integer, description: "The memory it begins at, as laid out"}
        last: {type: integer, description: "The last memory its channels use; first - 1 when none"}
    SectionInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        start: {type: integer, nullable: true, minimum: 0}
        size: {type: integer, nullable: true, minimum: 1}
        sort: {type: string, enum: [manual, name, freq]}
        default: {type: boolean, description: "Make it the default section; the old default stops being it"}
    SourceInput:
      type: object
      additionalProperties: false
      properties:
        query: {type: string}
        plan: {type: string, description: "A plan's name or ID, for a source that follows the plan; it can't change later"}
        sort: {type: string}
        section: {type: string, description: "A section's ID or name; a new source without one gets a section of its own"}
        plan_numbers: {type: string, enum: [compact, match]}
    SourcePreviewInput:
      type: object
      additionalProperties: false
      description: A SourceInput, and optionally the existing source it changes
      properties:
        number: {type: integer, minimum: 1, description: "An existing source to preview with these changes"}
        query: {type: string}
        plan: {type: string}
        sort: {type: string}
        section: {type: string}
        plan_numbers: {type: string, enum: [compact, match]}
    SyncResult:
      type: object
      required: [sources, added, resorted, dry_run, layout_error]
      properties:
        sources:
          type: array
          items:
            allOf:
              - {$ref: "#/components/schemas/AddResult"}
              - type: object
                required: [source, resorted, removed, note]
                properties:
                  source: {$ref: "#/components/schemas/Source"}
                  resorted: {type: integer}
                  removed: {type: array, items: {$ref: "#/components/schemas/Channel"}, description: "A plan's channels taken off because the plan dropped them"}
                  note: {type: string, description: "Why a plan source didn't change, such as an archived plan"}
        added: {type: integer}
        resorted: {type: integer}
        dry_run: {type: boolean}
        layout_error: {type: string, nullable: true, description: Set when the radio no longer fits its memories}

    OrgRef:
      type: object
      required: [org_id, name, role]
      properties:
        org_id: {type: string}
        name: {type: string}
        role: {type: string, enum: [operator, partner]}
    OrgRefInput:
      type: object
      additionalProperties: false
      required: [org_id]
      properties:
        org_id: {type: string, description: "An organization's ID or name"}
        role: {type: string, enum: [operator, partner], description: Default operator}
    Organization:
      type: object
      required: [id, name, kind, callsign, website, notes, revision, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [club, emergency, agency, individual]}
        callsign: {type: string}
        website: {type: string}
        notes: {type: string}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        name: {type: string}
        kind: {type: string}
        callsign: {type: string}
        website: {type: string}
        notes: {type: string}
        reason: {type: string, description: "Why, recorded in the history"}
    SystemMember:
      type: object
      additionalProperties: false
      required: [channel_id]
      properties:
        channel_id: {type: string, description: "A shared channel's ID; in input, also a unique prefix"}
        linking: {type: string, enum: [full-time, on-demand], description: Default full-time}
        notes: {type: string}
    System:
      type: object
      required: [id, name, link, networks, organizations, members, notes, revision, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        link: {type: string, enum: ["", allstar, echolink, irlp, wires-x, rf, other]}
        networks: {type: array, items: {type: string}, description: "The system's own nodes, NETWORK:NODE"}
        organizations: {type: array, items: {$ref: "#/components/schemas/OrgRef"}}
        members: {type: array, items: {$ref: "#/components/schemas/SystemMember"}}
        notes: {type: string}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SystemInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        name: {type: string}
        link: {type: string}
        networks: {type: array, items: {type: string}}
        organizations: {type: array, items: {$ref: "#/components/schemas/OrgRefInput"}}
        members: {type: array, items: {$ref: "#/components/schemas/SystemMember"}}
        notes: {type: string}
        reason: {type: string, description: "Why, recorded in the history"}
    PlanEntry:
      type: object
      additionalProperties: false
      required: [channel_id]
      description: A shared channel, or with a query (and channel_id null) a query section
      properties:
        channel_id: {type: string, nullable: true}
        query: {type: string}
        sort: {type: string}
        name: {type: string, description: "The channel's name in the plan; empty keeps its own"}
        assignment: {type: string}
        notes: {type: string}
        section_start: {type: integer, nullable: true, minimum: 1, description: The plan channel number the entry starts at}
    Plan:
      type: object
      required: [id, name, description, starts, ends, status, entries, revision, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        starts: {type: string, format: date, nullable: true}
        ends: {type: string, format: date, nullable: true}
        status: {type: string, enum: [draft, published, archived]}
        entries: {type: array, items: {$ref: "#/components/schemas/PlanEntry"}}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PlanInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        name: {type: string}
        description: {type: string}
        starts: {type: string, format: date, nullable: true}
        ends: {type: string, format: date, nullable: true}
        status: {type: string}
        entries: {type: array, items: {$ref: "#/components/schemas/PlanEntry"}}
        reason: {type: string, description: "Why, recorded in the history"}
    PlanRow:
      type: object
      required: [number, entry, channel, name, assignment, notes]
      properties:
        number: {type: integer, description: "The plan channel number (ICS 205's Ch #)"}
        entry: {type: integer, description: "The entry it comes from, numbered from 1"}
        channel: {$ref: "#/components/schemas/Channel"}
        name: {type: string}
        assignment: {type: string}
        notes: {type: string}
    RecordRevision:
      type: object
      required: [number, at, reason, author, changes]
      properties:
        number: {type: integer}
        at: {type: string, format: date-time}
        reason: {type: string}
        author: {type: string}
        changes: {type: array, items: {type: string}, description: What changed from the revision before}

    Model:
      type: object
      required: [name, description, format, chirp_model, memories, name_length, modes, bands_mhz, power, notes, source, origin]
      properties:
        name: {type: string}
        description: {type: string}
        format: {type: string}
        chirp_model: {type: string}
        memories: {type: array, items: {type: integer}, minItems: 2, maxItems: 2}
        name_length: {type: integer}
        modes: {type: array, items: {type: string}}
        bands_mhz: {type: array, items: {type: array, items: {type: number}, minItems: 2, maxItems: 2}}
        power:
          type: array
          items:
            type: object
            required: [label, watts, intent]
            properties:
              label: {type: string}
              watts: {type: number, nullable: true}
              intent: {type: string}
        notes: {type: string}
        source: {type: string}
        origin: {type: string, enum: [builtin, local, replaces_builtin, same_as_builtin], description: "Built into rflib, or from a file installed on the server (rflib model install): a model of its own, one replacing the built-in model of its name, or one that replaces it but now says the same"}
    Seed:
      type: object
      required: [id, description, count, installed, pending]
      properties:
        id: {type: string}
        description: {type: string}
        count: {type: integer}
        installed: {type: boolean, description: Whether the shared list has the list}
        pending: {type: integer, description: "Changes an update would make: channels to add, update, or retire"}
        channels: {type: array, items: {$ref: "#/components/schemas/Channel"}}
