name: yaesu-ftm6000
description: Yaesu FTM-6000 memory channels for ADMS-13 (File > Import on the Memories tab)
notes: |
  Every memory is written, as ADMS-13 exports them: channels first, then
  empty memories up to 999. Names are cut to 6 characters.

  Power: exporting a radio writes the model's level (HIGH, MID, LOW).
  Exporting channels directly maps their power intent (low, medium, high,
  max); channels without one get HIGH.

  Receive-only channels are written as simplex: the FTM-6000 has no
  per-memory transmit inhibit, and it only transmits on 2 m and 70 cm.

  Tone modes: OFF, TONE, and DCS are as seen in ADMS-13 exports. Tone squelch
  is written TONE SQL, as the radio shows it and Yaesu's other ADMS programs
  write it; not yet seen in an ADMS-13 export. The radio holds one CTCSS
  frequency per memory, so split tones (different transmit and receive CTCSS)
  can't be written. A copy of this profile in your profile directory can
  change any of these.
header: false
line_ending: lf
start: 1
slots: 999
max_name_length: 6
standard_tones_only: true
columns:
  - {name: Channel No, source: location}
  - {name: Receive Frequency, source: rx_mhz, decimals: 5}
  - {name: Transmit Frequency, source: tx_mhz, decimals: 5}
  - {name: Offset Frequency, source: offset_mhz, decimals: 2}
  - name: Offset Direction
    source: duplex
    map: {none: "OFF", "off": "OFF", plus: +RPT, minus: -RPT, split: -/+}
  - name: Operating Mode
    source: mode
    map: {FM: FM, NFM: FM, AM: AM}
  - {name: Tag, source: const, value: "ON"}
  - {name: Name, source: name}
  - name: Tone Mode
    source: tone_mode
    map: {none: "OFF", tone: TONE, tsql: TONE SQL, dcs: DCS}
  - {name: CTCSS Frequency, source: ctcss_hz, decimals: 1, suffix: " Hz", default: 100.0 Hz}
  - {name: DCS Code, source: dcs_code, default: "023"}
  - {name: User CTCSS, source: const, value: 1500 Hz}
  - name: Tx Power
    source: power
    map: {HIGH: HIGH, MID: MID, LOW: LOW, MEDIUM: MID, MAX: HIGH, "*": HIGH}
  - name: Scan
    source: skip
    map: {"true": "NO", "false": "YES"}
  - name: Step
    source: step_khz
    steps_khz: ["25", "5", "6.25", "12.5"]
    map: {"25": 25.0KHz, "20": 20.0KHz, "5": 5.0KHz, "6.25": 6.25KHz, "12.5": 12.5KHz}
  - name: Narrow
    source: narrow
    map: {"true": "ON", "false": "OFF"}
  - {name: Clock Shift, source: const, value: "OFF"}
  - {name: Comment, source: notes}
  - {name: Check, source: const, value: "0", empty: "0"}
